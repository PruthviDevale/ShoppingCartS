
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | StyleSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #f8dce8, #eee3f7, #fffafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(80, 50, 70, 0.12);
        }

        .logo {
            text-align: center;
            color: #bd7898;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #594454;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #887b86;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #594454;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #e5d5df;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #bd7898;
            box-shadow: 0 0 5px rgba(189, 120, 152, 0.2);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #bd7898;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #a65f81;
        }

        .messages {
            background: #fff0f0;
            color: #b33a3a;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #817580;
            font-size: 14px;
        }

        .login-link a {
            color: #bd7898;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #887b86;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">StyleSphere</div>

    <h2>Create Account</h2>
    <p class="subtitle">Join StyleSphere and discover your style.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="messages">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="/register/">
        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="full_name"
               placeholder="Enter your full name" required>

        <label>Username</label>
        <input type="text" name="username"
               placeholder="Choose a username" required>

        <label>Email Address</label>
        <input type="email" name="email"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Create a password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password"
               placeholder="Confirm your password" required>

        <button type="submit" class="register-btn">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login/">Login</a>
    </div>

    <a href="/" class="home-link">← Back to Home</a>

</div>

</body>
</html>
