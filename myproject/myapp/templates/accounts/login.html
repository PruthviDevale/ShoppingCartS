
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StyleSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #f8dce8, #eee3f7, #fffafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(80, 50, 70, 0.12);
        }

        .logo {
            text-align: center;
            color: #bd7898;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #594454;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #887b86;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #594454;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #e5d5df;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #bd7898;
            box-shadow: 0 0 5px rgba(189, 120, 152, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #bd7898;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #a65f81;
        }

        .messages {
            background: #fff0f0;
            color: #b33a3a;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #817580;
            font-size: 14px;
        }

        .register-link a {
            color: #bd7898;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #887b86;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover,
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">StyleSphere</div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to explore your favourite fashion.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="messages">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="/login/">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter your username" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/register/">Create Account</a>
    </div>

    <a href="/" class="home-link">← Back to Home</a>

</div>

</body>
</html>
